{% extends "base.html" %}

{% block content %}
<h2>Book List</h2>
<table>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Published Date</th>
    </tr>
    {% for book in books %}
    <tr>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.published_date }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No books available.</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
